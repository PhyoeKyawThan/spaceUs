<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>HOME</title>
  <style>

    body{
      margin: auto;
      width: 90%;
      text-align: center;
    }
    .image{
      width: 500px;
      height: 500px;
      margin: auto;
    }

    .image img{
      width: 100%;
      height: 100%;
    }

  </style>
</head>
<body>
  <h1>Welcome {{ current_user.username }}, Home</h1>
  {% for post in posts %}
    <h1>{{ post.username }}<h1>
    <p style="font-size: 0.7em">{{ post.caption }}</p>
    <div class="image">
      <img src="{{ post['image'] }}" alt="">
    </div>
  {% endfor %}
</body>
</html>
